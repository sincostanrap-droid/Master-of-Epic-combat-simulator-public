name: Reviewed GitHub Pages
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed artifact (false = build verification only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build only reviewed assets and reject unselected tracked files
        run: python tools/build-pages.py --output _site --check-git
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: ${{ inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish reviewed artifact
        id: deployment
        uses: actions/deploy-pages@v4
